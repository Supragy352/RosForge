[package]
name = "rosforge"
version = "0.1.0"
description = "RosForge — Node-graph package editor for ROS 2 Jazzy"
authors = ["RosForge Contributors"]
edition = "2021"
default-run = "rosforge"

[lib]
name = "rosforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rosforge"
path = "src/main.rs"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "=0.0.15"
tauri = { version = "2", default-features = false, features = ["wry", "compression", "dynamic-acl", "x11", "dbus", "devtools"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
insta = "1"
tempfile = "3"
